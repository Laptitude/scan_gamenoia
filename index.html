<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reconnaissance de Jeux Vidéo Universelle</title>
    <style>
        :root { --primary: #6366f1; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; }
        body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); max-width: 700px; margin: 0 auto; padding: 20px; text-align: center; }
        h1 { font-size: 2.5rem; margin-bottom: 5px; color: #a5b4fc; }
        .subtitle { color: #94a3b8; margin-bottom: 30px; }
        #drop-zone { border: 3px dashed #475569; background: var(--card); padding: 40px 20px; border-radius: 12px; cursor: pointer; transition: 0.3s; position: relative; }
        #drop-zone.hover { border-color: var(--primary); background: #1e293bba; }
        #fileInput { display: none; }
        #preview { max-width: 100%; max-height: 250px; border-radius: 8px; margin-top: 15px; display: none; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5); }
        #status { margin: 20px 0; font-size: 1.1rem; color: #cbd5e1; font-weight: 500; }
        .result-container { background: var(--card); padding: 20px; border-radius: 12px; text-align: left; margin-top: 20px; display: none; }
        .game-row { margin-bottom: 15px; }
        .game-name { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 5px; }
        .progress-bar { background: #334155; height: 12px; border-radius: 6px; overflow: hidden; }
        .progress-fill { background: linear-gradient(90deg, #4f46e5, #818cf8); height: 100%; width: 0%; transition: width 0.6s ease; }
        .loader { display: inline-block; width: 20px; height: 20px; border: 3px solid #f3f3f3; border-top: 3px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; vertical-align: middle; margin-right: 10px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <h1>Quel est ce jeu ?</h1>
    <p class="subtitle">Identifiez n'importe quelle capture d'écran localement, gratuitement et sans limite.</p>

    <!-- Zone de téléversement -->
    <div id="drop-zone">
        <p>Glissez-déposez votre capture d'écran ici ou <strong>cliquez pour parcourir</strong></p>
        <input type="file" id="fileInput" accept="image/*">
        <img id="preview" alt="Aperçu">
    </div>

    <!-- Statut d'avancement -->
    <div id="status"><span class="loader"></span>Initialisation de l'application...</div>

    <!-- Zone des résultats -->
    <div id="results" class="result-container">
        <h3 style="margin-top:0; color:#cbd5e1;">Résultats de la détection :</h3>
        <div id="rows-wrapper"></div>
    </div>

    <script type="module">
        import { initIA, analyserImage } from './app.js';

        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('fileInput');
        const preview = document.getElementById('preview');
        const statusText = document.getElementById('status');
        const resultsDiv = document.getElementById('results');
        const rowsWrapper = document.getElementById('rows-wrapper');

        // Mettre à jour l'affichage textuel du statut
        function updateStatus(message, showLoader = true) {
            statusText.innerHTML = showLoader ? `<span class="loader"></span>${message}` : message;
        }

        // Démarrage de l'application
        initIA(updateStatus);

        // Gestion du clic sur la zone
        dropZone.addEventListener('click', () => fileInput.click());

        // Drag & Drop animations
        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => { e.preventDefault(); dropZone.classList.add('hover'); }, false);
        });
        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => { e.preventDefault(); dropZone.classList.remove('hover'); }, false);
        });

        // Capture du fichier déposé ou sélectionné
        dropZone.addEventListener('drop', (e) => handleFiles(e.dataTransfer.files));
        fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

        function handleFiles(files) {
            if (files.length === 0) return;
            const file = files[0];
            
            const reader = new FileReader();
            reader.onload = function(event) {
                preview.src = event.target.result;
                preview.style.display = 'inline-block';
                process(event.target.result);
            };
            reader.readAsDataURL(file);
        }

        // Lancement du calcul et affichage
        async function process(imageSrc) {
            resultsDiv.style.display = 'none';
            
            const topResults = await analyserImage(imageSrc, (msg) => updateStatus(msg, true));
            
            if (!topResults) {
                updateStatus("Erreur lors de l'analyse.", false);
                return;
            }

            updateStatus("Analyse terminée !", false);
            rowsWrapper.innerHTML = '';
            resultsDiv.style.display = 'block';

            topResults.forEach(jeu => {
                // Conversion du score en pourcentage visible (ajusté pour la similarité CLIP)
                const pourcentage = Math.max(0, Math.min(100, (jeu.score * 100))).toFixed(1);
                
                const row = document.createElement('div');
                row.className = 'game-row';
                row.innerHTML = `
                    <div class="game-name"><span>${jeu.nom}</span><span>${pourcentage}%</span></div>
                    <div class="progress-bar"><div class="progress-fill" style="width: ${pourcentage}%"></div></div>
                `;
                rowsWrapper.appendChild(row);
            });
        }
    </script>
</body>
</html>
