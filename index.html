<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#d6336c">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ludothèque</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mu:#6b6a65;--ac:#d6336c;--bd:#e3e1da;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17171a;--card:#232328;--tx:#f0efe9;--mu:#9d9ca5;--ac:#f06595;--bd:#35353c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17171a;--card:#232328;--tx:#f0efe9;--mu:#9d9ca5;--ac:#f06595;--bd:#35353c;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:24px;margin:0 0 4px}
.sub{color:var(--mu);margin:0 0 18px;font-size:14px}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit}
button{padding:12px 14px;border:0;border-radius:10px;background:var(--ac);color:#fff;font:inherit;font-weight:600;cursor:pointer}
button.alt{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.wrap{position:relative;flex:1}
.sug{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--card);border:1px solid var(--bd);border-radius:10px;overflow:hidden;z-index:5}
.sug div{padding:10px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.sug div:hover{background:var(--bg)}
.sug small,.g small{color:var(--mu)}
#reader{margin:12px 0;border-radius:10px;overflow:hidden}
#msg{min-height:22px;margin:10px 0;font-size:14px;color:var(--mu)}
h2{font-size:17px;margin:22px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.g{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px}
.cov{height:70px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:700;color:#fff}
.g b{font-size:14px}
.g button{padding:6px;font-size:12px;margin-top:4px}
.empty{color:var(--mu);font-size:14px}
</style>
</head>
<body>
<main>
<h1>🎮 Ludothèque</h1>
<p class="sub">Prototype : ajoutez vos jeux par recherche ou par code-barres.</p>

<div class="row">
<div class="wrap"><input id="q" placeholder="Rechercher un jeu (ex. Zelda)" autocomplete="off"><div id="sug" class="sug" hidden></div></div>
<button id="scan">📷 Scanner</button>
</div>
<div id="reader" hidden></div>
<div class="row" style="margin-top:8px">
<input id="ean" inputmode="numeric" placeholder="Ou saisir un code EAN">
<button class="alt" id="go">OK</button>
</div>
<div id="msg"></div>

<h2>Ma collection (<span id="n">0</span>)</h2>
<div id="col" class="grid"></div>
<p class="sub" style="margin-top:24px">Codes de test : 3000000000011 (Zelda), 3000000000028 (Gran Turismo 7), 3000000000035 (Mario Kart 8).</p>
</main>

<script src="html5-qrcode.min.js"></script>
<script>
// Catalogue de démonstration. En production : appel à votre back-end, qui interroge IGDB/RAWG.
const CAT=[
["3000000000011","The Legend of Zelda: Breath of the Wild","Switch","#2f9e44"],
["3000000000028","Gran Turismo 7","PS5","#1971c2"],
["3000000000035","Mario Kart 8 Deluxe","Switch","#e03131"],
["3000000000042","Super Mario Odyssey","Switch","#e8590c"],
["3000000000059","Elden Ring","PS5","#5f3dc4"],
["3000000000066","God of War Ragnarök","PS5","#c2255c"],
["3000000000073","Forza Horizon 5","Xbox","#0c8599"],
["3000000000080","Halo Infinite","Xbox","#3b5bdb"],
["3000000000097","Animal Crossing: New Horizons","Switch","#37b24d"],
["3000000000103","Hollow Knight","Switch","#495057"],
["3000000000110","The Last of Us Part II","PS4","#862e9c"],
["3000000000127","Zelda: Tears of the Kingdom","Switch","#099268"]
];
const K="ludotheque:v1";
let own=[];
try{own=JSON.parse(localStorage.getItem(K)||"[]")}catch(e){own=[]}
const $=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem(K,JSON.stringify(own))}catch(e){}};
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const say=t=>$("msg").textContent=t;
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function render(){
  $("n").textContent=own.length;
  $("col").innerHTML=own.length?own.map(e=>{const g=CAT.find(x=>x[0]===e);return g?
    `<div class="g"><div class="cov" style="background:${g[3]}">${esc(g[1][0])}</div><b>${esc(g[1])}</b><small>${g[2]}</small><button class="alt" data-r="${e}">Retirer</button></div>`:""}).join("")
    :'<p class="empty">Aucun jeu pour l’instant.</p>';
}
function add(ean){
  const g=CAT.find(x=>x[0]===ean);
  if(!g){say("Code "+ean+" inconnu du catalogue. Essayez la recherche par titre.");return}
  if(own.includes(ean)){say(g[1]+" est déjà dans votre collection.");return}
  own.unshift(ean);save();render();say("Ajouté : "+g[1]);
}
$("col").onclick=e=>{const r=e.target.dataset.r;if(r){own=own.filter(x=>x!==r);save();render()}};

$("q").oninput=()=>{
  const v=norm($("q").value.trim());
  const m=v?CAT.filter(g=>norm(g[1]).includes(v)).slice(0,6):[];
  $("sug").hidden=!m.length;
  $("sug").innerHTML=m.map(g=>`<div data-e="${g[0]}"><span>${esc(g[1])}</span><small>${g[2]}</small></div>`).join("");
};
$("sug").onclick=e=>{const d=e.target.closest("[data-e]");if(d){add(d.dataset.e);$("q").value="";$("sug").hidden=true}};
$("go").onclick=()=>{const v=$("ean").value.trim();if(v){add(v);$("ean").value=""}};
$("ean").onkeydown=e=>{if(e.key==="Enter")$("go").click()};

let sc=null;
async function stop(){if(sc){try{await sc.stop()}catch(e){}sc=null}$("reader").hidden=true;$("scan").textContent="📷 Scanner"}
$("scan").onclick=async()=>{
  if(sc){stop();return}
  if(typeof Html5Qrcode==="undefined"){say("Scanner indisponible ici. Utilisez la saisie du code.");return}
  $("reader").hidden=false;$("scan").textContent="✖ Arrêter";say("Présentez le code-barres devant la caméra…");
  try{
    sc=new Html5Qrcode("reader");
    await sc.start({facingMode:"environment"},{fps:10,qrbox:{width:260,height:120}},t=>{stop();add(t)},()=>{});
  }catch(e){sc=null;$("reader").hidden=true;$("scan").textContent="📷 Scanner";say("Caméra inaccessible (autorisation ou HTTPS requis). Utilisez la saisie du code.")}
};
render();
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>
</body>
</html>
