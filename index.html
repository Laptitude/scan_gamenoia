<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reconnaissance de Jeu Vidéo (100% Gratuit)</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; text-align: center; }
        #preview { max-width: 100%; max-height: 300px; margin-top: 20px; display: none; }
        #status { font-weight: bold; margin-top: 20px; color: #555; }
        #result { font-size: 24px; font-weight: bold; color: #007bff; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>Quel est ce jeu ?</h1>
    <p>Sélectionnez une capture d'écran pour l'analyser localement sans aucune limite.</p>

    <!-- Zone de dépôt de fichier -->
    <input type="file" id="imageInput" accept="image/*">
    <br>
    <img id="preview" alt="Aperçu de la capture d'écran">

    <!-- Indicateurs d'état -->
    <div id="status">Initialisation de l'IA (veuillez patienter)...</div>
    <div id="result"></div>

    <!-- Script principal de l'IA -->
    <script type="module">
        // Importation du modèle d'IA CLIP en JavaScript depuis un CDN gratuit
        import { pipeline } from 'https://jsdelivr.net';

        let classifier;
        const statusDiv = document.getElementById('status');
        const resultDiv = document.getElementById('result');
        const imageInput = document.getElementById('imageInput');
        const preview = document.getElementById('preview');

        // 1. Définissez la liste des jeux que votre IA doit être capable de reconnaître
        const listeJeux = [
            'Minecraft',
            'Grand Theft Auto V',
            'The Legend of Zelda: Breath of the Wild',
            'Elden Ring',
            'Fortnite',
            'Cyberpunk 2077',
            'Super Mario Odyssey',
            'Red Dead Redemption 2'
        ];

        // 2. Charger le modèle au démarrage de la page
        async function initIA() {
            try {
                // Utilisation du modèle CLIP léger optimisé pour le web
                classifier = await pipeline('zero-shot-image-classification', 'Xenova/clip-vit-base-patch32');
                statusDiv.innerText = "Prêt ! Choisissez une image.";
            } catch (error) {
                statusDiv.innerText = "Erreur lors du chargement de l'IA : " + error.message;
            }
        }

        // 3. Gérer l'analyse quand l'utilisateur charge une photo
        imageInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            // Afficher l'image à l'écran
            const reader = new FileReader();
            reader.onload = function(event) {
                preview.src = event.target.result;
                preview.style.display = 'inline-block';
                analyserImage(event.target.result);
            }
            reader.readAsDataURL(file);
        });

        // 4. Lancer la reconnaissance de l'image
        async function analyserImage(imageSrc) {
            if (!classifier) {
                alert("L'IA n'est pas encore prête.");
                return;
            }

            statusDiv.innerText = "Analyse de l'image en cours (calcul local)...";
            resultDiv.innerText = "";

            try {
                // L'IA compare l'image avec votre liste de jeux
                const output = await classifier(imageSrc, listeJeux);
                
                // Récupérer le meilleur résultat
                const topResult = output[0];
                const scorePourcentage = (topResult.score * 100).toFixed(1);

                statusDiv.innerText = "Analyse terminée !";
                resultDiv.innerText = `${topResult.label} (${scorePourcentage}%)`;
            } catch (error) {
                statusDiv.innerText = "Erreur pendant l'analyse.";
                resultDiv.innerText = error.message;
            }
        }

        // Lancement initial
        initIA();
    </script>
</body>
</html>
