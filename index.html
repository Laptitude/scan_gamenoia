<!DOCTYPE html>
<html lang="fr">
<head>
    <meta http-equiv="Content-Security-Policy" content="
    default-src 'self'; 
    script-src 'self' https://cdn.jsdelivr.net https://unpkg.com 'sha256-BP9tOtjPaHpYcIM7SachnWZVVvPBcyJ91eLU/FoghBE='; 
    connect-src 'self' https://cdn.jsdelivr.net https://unpkg.com https://huggingface.co https://huggingface.co data: blob:; 
    img-src 'self' data: blob:; 
    style-src 'self' 'unsafe-inline';">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reconnaissance de Jeux Vidéo Universelle</title>
    <style>
        :root { --primary: #6366f1; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; }
        body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); max-width: 700px; margin: 0 auto; padding: 20px; text-align: center; }
        h1 { font-size: 2.5rem; margin-bottom: 5px; color: #a5b4fc; }
        .subtitle { color: #94a3b8; margin-bottom: 30px; }
        #drop-zone { border: 3px dashed #475569; background: var(--card); padding: 40px 20px; border-radius: 12px; cursor: pointer; transition: 0.3s; position: relative; }
        #drop-zone.hover { border-color: var(--primary); background: #1e293bba; }
        #fileInput { display: none; }
        #preview { max-width: 100%; max-height: 250px; border-radius: 8px; margin-top: 15px; display: none; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5); }
        #status { margin: 20px 0; font-size: 1.1rem; color: #cbd5e1; font-weight: 500; }
        .result-container { background: var(--card); padding: 20px; border-radius: 12px; text-align: left; margin-top: 20px; display: none; }
        .game-row { margin-bottom: 15px; }
        .game-name { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 5px; }
        .progress-bar { background: #334155; height: 12px; border-radius: 6px; overflow: hidden; }
        .progress-fill { background: linear-gradient(90deg, #4f46e5, #818cf8); height: 100%; width: 0%; transition: width 0.6s ease; }
        .loader { display: inline-block; width: 20px; height: 20px; border: 3px solid #f3f3f3; border-top: 3px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; vertical-align: middle; margin-right: 10px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <h1>Quel est ce jeu ?</h1>
    <p class="subtitle">Identifiez n'importe quelle capture d'écran localement, gratuitement et sans limite.</p>

    <!-- Zone de téléversement -->
    <div id="drop-zone">
        <p>Glissez-déposez votre capture d'écran ici ou <strong>cliquez pour parcourir</strong></p>
        <input type="file" id="fileInput" accept="image/*">
        <img id="preview" alt="Aperçu">
    </div>

    <!-- Statut d'avancement -->
    <div id="status"><span class="loader"></span>Initialisation de l'application...</div>

    <!-- Zone des résultats -->
    <div id="results" class="result-container">
        <h3 style="margin-top:0; color:#cbd5e1;">Résultats de la détection :</h3>
        <div id="rows-wrapper"></div>
    </div>

    <!-- Uniquement cette ligne, pas de code à l'intérieur -->
    <script type="module" src="./main.js"></script>
</body>
</html>
