<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16352a">
<title>Ludothèque Scan</title>
<script async src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
<script async src="https://docs.opencv.org/4.5.0/opencv.js"></script>
<style>
:root{--felt:#16352a;--felt2:#1f4637;--paper:#f4efe3;--ink:#1b1a17;--mut:#6f6a5c;--ac:#e0a526;--ok:#37d67a;--bd:#d8d0bc}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--felt);color:var(--paper);font:16px/1.5 Georgia,"Iowan Old Style",serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
h1{font-size:1.25rem;margin:0;font-weight:700;letter-spacing:.01em}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 6px}
#status{font:.8rem system-ui,sans-serif;color:#b9cfc4}
nav{display:flex;gap:6px;padding:8px 16px;font-family:system-ui,sans-serif}
button,.btn{font:600 .9rem system-ui,sans-serif;border:0;border-radius:8px;padding:10px 14px;background:var(--felt2);color:var(--paper);cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
button.on{background:var(--ac);color:var(--ink)}
button.pri{background:var(--ac);color:var(--ink)}
button.danger{background:#7d2b22}
main{padding:0 16px 40px;max-width:760px;margin:0 auto}
section{display:none}section.show{display:block}
.seg{display:flex;gap:6px;margin:6px 0 10px}
#stage{position:relative;background:#000;border-radius:10px;overflow:hidden;min-height:200px}
#view{width:100%;display:block;cursor:pointer}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.hint{font:.85rem system-ui,sans-serif;color:#b9cfc4;margin:6px 0}
.card{background:var(--paper);color:var(--ink);border-radius:10px;padding:14px;margin:10px 0}
.row{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}
.row img{width:50px;height:50px;object-fit:cover;border-radius:6px;background:#ddd}
.row .t{flex:1}.row small{color:var(--mut);font-family:system-ui,sans-serif}
label{display:block;font:600 .85rem system-ui,sans-serif;margin:10px 0 4px}
input[type=text],textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;font:1rem system-ui,sans-serif;background:#fff;color:var(--ink)}
input[type=file]{font:.9rem system-ui,sans-serif;width:100%}
dialog{border:0;border-radius:12px;background:var(--paper);color:var(--ink);max-width:min(92vw,520px);padding:20px}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h2{margin:0 0 4px}
.meta{font:.85rem system-ui,sans-serif;color:var(--mut);margin-bottom:10px}
.muted{color:var(--mut);font-family:system-ui,sans-serif}
</style>
</head>
<body>
<header><h1>Ludothèque Scan</h1><span id="status">Démarrage…</span></header>
<nav>
  <button data-tab="scan" class="on">Scanner</button>
  <button data-tab="cat">Catalogue</button>
  <button data-tab="add">Ajouter un jeu</button>
</nav>
<main>
<section id="scan" class="show">
  <div class="seg">
    <button id="mLive" class="on">Temps réel</button>
    <button id="mPhoto">Scan photo</button>
  </div>
  <div id="stage"><canvas id="view" width="640" height="480"></canvas></div>
  <div class="bar" id="photoBar" hidden>
    <button class="pri" id="btnShot">Capturer et analyser</button>
    <button id="btnResume" hidden>Reprendre la caméra</button>
    <label class="btn" style="margin:0">Importer une photo<input id="fileScan" type="file" accept="image/*" hidden></label>
  </div>
  <p class="hint" id="hint">Vise une boîte de jeu : un cadre vert apparaît sur les jeux reconnus. Touche un cadre pour ouvrir la fiche.</p>
</section>

<section id="cat">
  <div class="bar">
    <button id="btnExport">Exporter bibliotheque.db</button>
    <label class="btn" style="margin:0">Importer un .db<input id="fileDb" type="file" hidden></label>
    <button id="btnSync">Récupérer depuis le serveur</button>
  </div>
  <div class="card" id="list"></div>
</section>

<section id="add">
  <div class="card">
    <label for="fNom">Nom du jeu</label><input id="fNom" type="text">
    <label for="fEd">Éditeur et année</label><input id="fEd" type="text" placeholder="Ex. Days of Wonder, 2004">
    <label for="fDesc">Description et règles</label><textarea id="fDesc" rows="5"></textarea>
    <label for="fImg">Photo de la face avant de la boîte (bien cadrée, de face)</label>
    <input id="fImg" type="file" accept="image/*">
    <div class="bar"><button class="pri" id="btnAdd">Enregistrer le jeu</button></div>
    <p class="hint" id="addMsg" style="color:#555"></p>
  </div>
</section>
</main>

<dialog id="dlg"><h2 id="dN"></h2><div class="meta" id="dE"></div><p id="dD" style="white-space:pre-wrap"></p><div class="bar"><button id="dClose">Fermer</button></div></dialog>

<video id="vid" playsinline muted hidden></video>

<script>
const SQLBASE='https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/';
const $=s=>document.querySelector(s);
const view=$('#view'),ctx=view.getContext('2d'),vid=$('#vid');
const work=document.createElement('canvas'),still=document.createElement('canvas');
let SQL,db,GAMES=[],mode='live',stream=null,frozen=false,results=[],busy=false,ready=false,tab='scan';

const status=t=>$('#status').textContent=t;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const until=f=>new Promise(r=>{const t=setInterval(()=>{if(f()){clearInterval(t);r()}},100)});

/* ---------- Stockage local (IndexedDB) ---------- */
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('ludotheque',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>res(r.result);r.onerror=()=>rej()});
async function idbGet(){try{const d=await idb();return await new Promise(r=>{const q=d.transaction('k').objectStore('k').get('db');q.onsuccess=()=>r(q.result);q.onerror=()=>r()})}catch(e){}}
async function idbSet(v){try{const d=await idb();d.transaction('k','readwrite').objectStore('k').put(v,'db')}catch(e){}}
const persist=()=>idbSet(db.export());

/* ---------- Démarrage ---------- */
async function boot(){
  status('Chargement de SQLite…');
  await until(()=>window.initSqlJs);
  SQL=await initSqlJs({locateFile:f=>SQLBASE+f});
  let buf=await idbGet();
  if(!buf){try{const r=await fetch('bibliotheque.db',{cache:'no-cache'});if(r.ok)buf=new Uint8Array(await r.arrayBuffer())}catch(e){}}
  openDb(buf);
  status('Chargement d’OpenCV…');
  await until(()=>window.cv&&cv.Mat&&cv.ORB&&cv.BFMatcher);
  ready=true;loadGames();status(GAMES.length+' jeu(x) en mémoire');
  startCam();setInterval(tick,300);requestAnimationFrame(draw);
}
function openDb(buf){
  db=buf?new SQL.Database(buf):new SQL.Database();
  db.run(`CREATE TABLE IF NOT EXISTS jeux(id INTEGER PRIMARY KEY,nom TEXT,description TEXT,editeur_annee TEXT,signatures_orb BLOB,points BLOB,nb INTEGER,dimensions_boite TEXT,miniature_boite TEXT)`);
}
function loadGames(){
  GAMES.forEach(g=>g.des.delete());GAMES=[];
  const st=db.prepare('SELECT * FROM jeux');
  while(st.step()){
    const r=st.getAsObject(),[w,h]=r.dimensions_boite.split('x').map(Number);
    const des=new cv.Mat(r.nb,32,cv.CV_8U);des.data.set(r.signatures_orb);
    const p=r.points;
    GAMES.push({...r,w,h,des,pts:new Float32Array(p.buffer.slice(p.byteOffset,p.byteOffset+p.byteLength))});
  }
  st.free();renderList();
}

/* ---------- Vision ---------- */
function features(canvas,n){
  const rgba=cv.imread(canvas),gray=new cv.Mat();
  cv.cvtColor(rgba,gray,cv.COLOR_RGBA2GRAY);rgba.delete();
  const orb=new cv.ORB(n),kp=new cv.KeyPointVector(),des=new cv.Mat(),mask=new cv.Mat();
  orb.detectAndCompute(gray,mask,kp,des);
  const pts=new Float32Array(kp.size()*2);
  for(let i=0;i<kp.size();i++){const p=kp.get(i).pt;pts[2*i]=p.x;pts[2*i+1]=p.y}
  gray.delete();mask.delete();kp.delete();orb.delete();
  return{des,pts};
}
function convexOk(q){
  let s=0,A=0;
  for(let i=0;i<4;i++){const j=(i+1)%4,k=(i+2)%4;
    const c=(q[2*j]-q[2*i])*(q[2*k+1]-q[2*j+1])-(q[2*j+1]-q[2*i+1])*(q[2*k]-q[2*j]);
    s+=c>0?1:-1;A+=q[2*i]*q[2*j+1]-q[2*j]*q[2*i+1];}
  return Math.abs(s)===4&&Math.abs(A/2)>400;
}
function analyse(canvas,nf,minIn){
  const f=features(canvas,nf),out=[];
  if(f.des.rows>=10&&GAMES.length){
    const bf=new cv.BFMatcher(cv.NORM_HAMMING,false);
    for(const g of GAMES){
      const m=new cv.DMatchVectorVector();
      bf.knnMatch(g.des,f.des,m,2);
      const s=[],d=[];
      for(let i=0;i<m.size();i++){
        const v=m.get(i);if(v.size()<2)continue;
        const a=v.get(0),b=v.get(1);
        if(a.distance<0.75*b.distance){
          s.push(g.pts[2*a.queryIdx],g.pts[2*a.queryIdx+1]);
          d.push(f.pts[2*a.trainIdx],f.pts[2*a.trainIdx+1]);
        }
      }
      m.delete();
      if(s.length/2<minIn)continue;
      const n=s.length/2,S=cv.matFromArray(n,1,cv.CV_32FC2,s),D=cv.matFromArray(n,1,cv.CV_32FC2,d),mk=new cv.Mat();
      const H=cv.findHomography(S,D,cv.RANSAC,4,mk);
      if(!H.empty()){
        const inl=cv.countNonZero(mk);
        if(inl>=minIn){
          const C=cv.matFromArray(4,1,cv.CV_32FC2,[0,0,g.w,0,g.w,g.h,0,g.h]),T=new cv.Mat();
          cv.perspectiveTransform(C,T,H);
          const q=Array.from(T.data32F);
          if(convexOk(q))out.push({g,q,inl});
          C.delete();T.delete();
        }
      }
      S.delete();D.delete();mk.delete();H.delete();
    }
    bf.delete();
  }
  f.des.delete();
  return out;
}

/* ---------- Caméra et affichage ---------- */
async function startCam(){
  if(stream)return;
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1920},height:{ideal:1080}},audio:false});
    vid.srcObject=stream;await vid.play();
  }catch(e){
    stream=null;
    $('#hint').textContent='Caméra indisponible ('+e.name+'). Le site doit être en HTTPS et la permission accordée. Tu peux importer une photo en mode Scan photo.';
  }
}
function stopCam(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
function draw(){
  requestAnimationFrame(draw);
  if(tab!=='scan')return;
  if(frozen){
    if(view.width!==still.width){view.width=still.width;view.height=still.height}
    ctx.drawImage(still,0,0);
  }else if(stream&&vid.videoWidth){
    const w=640,h=Math.round(640*vid.videoHeight/vid.videoWidth);
    if(view.width!==w||view.height!==h){view.width=w;view.height=h}
    ctx.drawImage(vid,0,0,w,h);
  }else return;
  const k=view.width/640;
  ctx.lineWidth=3*k;ctx.font=`bold ${15*k}px system-ui,sans-serif`;
  for(const r of results){
    const q=r.q;
    ctx.strokeStyle='#37d67a';ctx.fillStyle='rgba(55,214,122,.18)';
    ctx.beginPath();ctx.moveTo(q[0],q[1]);for(let i=1;i<4;i++)ctx.lineTo(q[2*i],q[2*i+1]);ctx.closePath();ctx.fill();ctx.stroke();
    const t=r.g.nom,tw=ctx.measureText(t).width+12*k;
    ctx.fillStyle='#16352a';ctx.fillRect(q[0],q[1]-24*k,tw,24*k);
    ctx.fillStyle='#fff';ctx.fillText(t,q[0]+6*k,q[1]-7*k);
  }
}
function tick(){
  if(!ready||busy||frozen||tab!=='scan'||mode!=='live'||!stream||!vid.videoWidth||!GAMES.length)return;
  busy=true;
  try{
    work.width=640;work.height=Math.round(640*vid.videoHeight/vid.videoWidth);
    work.getContext('2d').drawImage(vid,0,0,work.width,work.height);
    results=analyse(work,500,10);
  }catch(e){console.error(e)}
  busy=false;
}
function fit(img,max){
  const s=Math.min(1,max/Math.max(img.width||img.videoWidth,img.height||img.videoHeight));
  const c=document.createElement('canvas');
  c.width=Math.round((img.width||img.videoWidth)*s);c.height=Math.round((img.height||img.videoHeight)*s);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c;
}
function loadImg(file){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file)})}
async function scanStill(c){
  still.width=c.width;still.height=c.height;still.getContext('2d').drawImage(c,0,0);
  frozen=true;results=[];$('#btnResume').hidden=false;
  $('#hint').textContent='Analyse en cours…';
  await new Promise(r=>setTimeout(r,60));
  try{results=analyse(still,4000,12)}catch(e){console.error(e)}
  $('#hint').textContent=results.length?results.length+' jeu(x) reconnu(s). Touche un cadre pour la fiche.':'Aucun jeu reconnu. Rapproche-toi, évite les reflets et cadre les boîtes de face.';
}
function setMode(m){
  mode=m;frozen=false;results=[];
  $('#mLive').classList.toggle('on',m==='live');$('#mPhoto').classList.toggle('on',m==='photo');
  $('#photoBar').hidden=m!=='photo';$('#btnResume').hidden=true;
  $('#hint').textContent=m==='live'?'Vise une boîte de jeu : un cadre vert apparaît sur les jeux reconnus. Touche un cadre pour ouvrir la fiche.':'Cadre ta bibliothèque, puis capture : analyse haute précision en une fois.';
}
$('#mLive').onclick=()=>setMode('live');
$('#mPhoto').onclick=()=>setMode('photo');
$('#btnResume').onclick=()=>{frozen=false;results=[];$('#btnResume').hidden=true};
$('#btnShot').onclick=()=>{
  if(!ready||!stream||!vid.videoWidth)return alert('La caméra ou OpenCV n’est pas prêt.');
  scanStill(fit(vid,1920));
};
$('#fileScan').onchange=async e=>{
  const f=e.target.files[0];if(!f||!ready)return;
  scanStill(fit(await loadImg(f),1920));e.target.value='';
};

/* clic sur un cadre */
function inPoly(q,x,y){let c=false;for(let i=0,j=3;i<4;j=i++){if((q[2*i+1]>y)!==(q[2*j+1]>y)&&x<(q[2*j]-q[2*i])*(y-q[2*i+1])/(q[2*j+1]-q[2*i+1])+q[2*i])c=!c}return c}
view.onclick=e=>{
  const r=view.getBoundingClientRect(),x=(e.clientX-r.left)*view.width/r.width,y=(e.clientY-r.top)*view.height/r.height;
  const hit=[...results].reverse().find(o=>inPoly(o.q,x,y));
  if(hit)openGame(hit.g);
};
function openGame(g){
  $('#dN').textContent=g.nom;$('#dE').textContent=g.editeur_annee||'';$('#dD').textContent=g.description||'Pas de description.';
  $('#dlg').showModal();
}
$('#dClose').onclick=()=>$('#dlg').close();

/* ---------- Catalogue ---------- */
function renderList(){
  $('#list').innerHTML=GAMES.length?GAMES.map(g=>`<div class="row"><img alt="" src="${esc(g.miniature_boite)}"><div class="t"><b>${esc(g.nom)}</b><br><small>${esc(g.editeur_annee)}</small></div><button data-open="${g.id}">Fiche</button><button class="danger" data-del="${g.id}">Supprimer</button></div>`).join(''):'<p class="muted">Le catalogue est vide. Ajoute ton premier jeu avec une photo de sa boîte, ou importe un fichier bibliotheque.db.</p>';
}
$('#list').onclick=e=>{
  const o=e.target.dataset.open,d=e.target.dataset.del;
  if(o)openGame(GAMES.find(g=>g.id==o));
  if(d&&confirm('Supprimer ce jeu ?')){db.run('DELETE FROM jeux WHERE id=?',[+d]);persist();loadGames();status(GAMES.length+' jeu(x) en mémoire')}
};
$('#btnExport').onclick=()=>{
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([db.export()],{type:'application/octet-stream'}));
  a.download='bibliotheque.db';a.click();
};
$('#fileDb').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  openDb(new Uint8Array(await f.arrayBuffer()));await persist();loadGames();e.target.value='';status(GAMES.length+' jeu(x) importé(s)');
};
$('#btnSync').onclick=async()=>{
  try{
    const r=await fetch('bibliotheque.db',{cache:'no-cache'});if(!r.ok)throw 0;
    openDb(new Uint8Array(await r.arrayBuffer()));await persist();loadGames();status(GAMES.length+' jeu(x) à jour');
  }catch(e){alert('Aucun fichier bibliotheque.db trouvé sur le serveur.')}
};

/* ---------- Ajout d'un jeu ---------- */
$('#btnAdd').onclick=async()=>{
  const nom=$('#fNom').value.trim(),file=$('#fImg').files[0],msg=$('#addMsg');
  if(!ready)return msg.textContent='OpenCV charge encore, patiente quelques secondes.';
  if(!nom||!file)return msg.textContent='Indique un nom et choisis une photo de la boîte.';
  msg.textContent='Calcul de la signature…';
  await new Promise(r=>setTimeout(r,30));
  const c=fit(await loadImg(file),600),f=features(c,1000);
  if(f.des.rows<40){f.des.delete();return msg.textContent='Trop peu de détails détectés. Utilise une photo plus nette et mieux éclairée.'}
  const th=document.createElement('canvas');th.width=th.height=50;
  const t=th.getContext('2d'),s=Math.min(c.width,c.height);
  t.drawImage(c,(c.width-s)/2,(c.height-s)/2,s,s,0,0,50,50);
  db.run('INSERT INTO jeux(nom,description,editeur_annee,signatures_orb,points,nb,dimensions_boite,miniature_boite) VALUES(?,?,?,?,?,?,?,?)',
    [nom,$('#fDesc').value,$('#fEd').value,new Uint8Array(f.des.data),new Uint8Array(f.pts.buffer),f.des.rows,c.width+'x'+c.height,th.toDataURL('image/jpeg',.6)]);
  f.des.delete();await persist();loadGames();
  msg.textContent='« '+nom+' » enregistré ('+GAMES.at(-1).nb+' points).';
  ['#fNom','#fEd','#fDesc','#fImg'].forEach(i=>$(i).value='');status(GAMES.length+' jeu(x) en mémoire');
};

/* ---------- Onglets ---------- */
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  tab=b.dataset.tab;
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('section').forEach(s=>s.classList.toggle('show',s.id===tab));
  if(tab==='scan'&&ready)startCam();else stopCam();
});
boot();
</script>
</body>
</html>
